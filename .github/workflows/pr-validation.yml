name: PR Validation

on:
  push:
    branches: [ dev, master ]
  pull_request:
    branches: [ dev, master ]

# Cancel superseded runs for the same ref.
concurrency:
  group: pr-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest ]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Build & Test
        shell: pwsh
        # Skip local-only, process-wide measurement smokes (idle-CPU / contention) — flaky on
        # shared/constrained CI runners. They still run locally; the portable idle-CPU acceptance
        # gate is Phase 3 [GATED] (per-thread measurement on real hardware).
        env:
          TEST_FILTER: "Category!=Measurement"
        run: ./build.ps1 Test

      - name: Benchmark smoke
        shell: pwsh
        run: ./build.ps1 Benchmark -Smoke

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}
          path: TestResults/**
          if-no-files-found: ignore
